[package]
name = "tinyp2p"
version = "0.1.0"
edition = "2024"

[dependencies]
bs58 = "0.5.1"
futures = "0.3.31"
multiaddr = "0.18.2"
multihash = { version = "0.18", default-features = false, features = ["std", "multihash-impl", "identity", "sha2"] }
protoc = "2.28.0"
serde = "1.0.228"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
